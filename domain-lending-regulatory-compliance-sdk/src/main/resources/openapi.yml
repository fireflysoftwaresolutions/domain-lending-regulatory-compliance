openapi: 3.0.1
info:
  title: Domain Lending Regulatory Compliance API
  description: "Orchestrates AML cases through core-lending-regulatory-compliance.\
    \ It creates, updates, changes status, and closes AML cases through the regulatory\
    \ compliance core. Party, contract, and product identifiers stay UUIDs."
  contact:
    name: Firefly Software Foundation
    email: dev@fireflysoftware.io
  version: 1.0.0
servers:
- url: https://openplatform.fireflysoftware.io/domain-lending-regulatory-compliance
  description: Development Environment
- url: /
  description: Local Development Environment
tags:
- name: AmlCases
  description: Domain orchestration for AML cases
paths:
  /api/v1/aml-cases/{amlCaseId}/status:
    put:
      tags:
      - AmlCases
      summary: Update status
      description: Runs the status saga against core-lending-regulatory-compliance.
      operationId: updateStatus
      parameters:
      - name: amlCaseId
        in: path
        description: Core identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusChangeRequest"
        required: true
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmlCaseDTO"
        "404":
          description: Not found
  /api/v1/aml-cases/{amlCaseId}:
    get:
      tags:
      - AmlCases
      summary: Get AML case
      description: Reads one record from core-lending-regulatory-compliance.
      operationId: get
      parameters:
      - name: amlCaseId
        in: path
        description: Core identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmlCaseDTO"
        "404":
          description: Not found
    put:
      tags:
      - AmlCases
      summary: Update AML case
      description: Runs the update saga against core-lending-regulatory-compliance.
        Status is left unchanged.
      operationId: update
      parameters:
      - name: amlCaseId
        in: path
        description: Core identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmlCaseDTO"
        required: true
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmlCaseDTO"
        "404":
          description: Not found
    delete:
      tags:
      - AmlCases
      summary: Remove AML case
      description: Deletes the record through core-lending-regulatory-compliance when
        that core allows removal.
      operationId: remove
      parameters:
      - name: amlCaseId
        in: path
        description: Core identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      responses:
        "204":
          description: Removed
        "404":
          description: Not found
  /api/v1/aml-cases/{amlCaseId}/close:
    post:
      tags:
      - AmlCases
      summary: Close AML case
      description: Closes an AML case by writing CLOSED when the regulatory compliance
        core allows that status.
      operationId: close
      parameters:
      - name: amlCaseId
        in: path
        description: Core identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
        required: true
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmlCaseDTO"
        "404":
          description: Not found
  /api/v1/aml-cases:
    post:
      tags:
      - AmlCases
      summary: Create AML case
      description: Runs the register saga against core-lending-regulatory-compliance.
      operationId: create
      parameters:
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmlCaseDTO"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmlCaseDTO"
        "400":
          description: Invalid request
components:
  schemas:
    StatusChangeRequest:
      type: object
      properties:
        status:
          type: string
        statusReason:
          type: string
    AmlCaseDTO:
      required:
      - amlCaseStatus
      - caseOpenedAt
      - customerId
      - reportingRunId
      - riskLevel
      - transactionId
      type: object
      properties:
        amlCaseId:
          type: string
          format: uuid
          nullable: true
        reportingRunId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        transactionId:
          type: string
          format: uuid
        amlCaseStatus:
          type: string
          enum:
          - OPEN
          - INVESTIGATING
          - REPORTED
          - CLOSED
          - ESCALATED
        caseOpenedAt:
          type: string
          format: date
        caseClosedAt:
          type: string
          format: date
          nullable: true
        riskLevel:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
    ReasonRequest:
      type: object
      properties:
        statusReason:
          type: string
